schema_version: 1
phase: 7
status: protocol_frozen
research_questions:
  rq1: >-
    Can Vanilla SCPA, GenePT-informed SCPA, and a context-aware LLM recover
    known synthetically perturbed pathway genes?
  rq2: >-
    Does correct biological gene-description correspondence improve LLM
    ground-truth recovery compared with stats-only and shuffled-description controls?

source:
  dataset: GSE212270
  population: naive_cd4_0h
  counts_export: data/interim/genept_scpa/phase2_export/naive_cd4/naive_cd4_export_manifest.json
  counts_export_files:
    counts: data/interim/genept_scpa/phase2_export/naive_cd4/naive_cd4_rna_counts_genes_by_cells.mtx
    genes: data/interim/genept_scpa/phase2_export/naive_cd4/naive_cd4_gene_ids.txt
    cell_ids: data/interim/genept_scpa/phase2_export/naive_cd4/naive_cd4_cell_ids.txt
    metadata: data/interim/genept_scpa/phase2_export/naive_cd4/naive_cd4_metadata.csv
  export_path_resolution: exact_repo_relative_paths_verified_against_export_manifest_sha256
  phase4_manifest: data/processed/genept_scpa/phase4/pathway_projection_manifest.json
  descriptions: data/reference/genept_scpa/genept_ada002/NCBI_summary_of_genes.json
  embeddings: data/reference/genept_scpa/genept_ada002/GenePT_gene_embedding_ada_text.pickle

cohort:
  cells_per_pseudo_condition: 500
  total_selected_cells: 1000
  split_seed: 20260814
  candidate_order: sorted_source_cell_ids
  sampling: numpy_generator_pcg64_without_replacement
  split_rule: select_1000_once_then_seeded_permutation_first_500_A_remaining_500_B
  require_disjoint: true
  replication:
    pilot_split_seeds: [20260814]
    production_split_seeds: []
    production_split_count_status: pending_runtime_only_pilot
    freeze_rule: choose_count_from_runtime_measurements_before_scientific_metrics
    prompt_order_repeats_measure: llm_order_stability
    pseudo_split_repeats_measure: biological_sampling_robustness

normalization:
  source_layer: RNA_counts
  full_transcriptome_total: 10000
  transform: log1p
  order: normalize_full_transcriptome_then_subset_pathway
  injection_space: normalized_log1p_expression
  post_injection_renormalization: false

pathways:
  universe: frozen_phase4_paired_pathways
  use_phase4_or_phase5_results_for_selection: false
  min_analysis_genes: 15
  max_analysis_genes: 60
  require_usable_description_for_every_gene: true
  selection_seed: 20260815
  size_bins:
    small: [15, 25]
    medium: [26, 40]
    large: [41, 60]
  source_bin_quota:
    KEGG: {small: 2, medium: 2, large: 2}
    REACTOME: {small: 2, medium: 2, large: 1}
    HALLMARK: {small: 0, medium: 0, large: 0}
  hallmark_note: no_pathway_meets_all_frozen_size_and_description_criteria
  reactome_large_note: only_one_pathway_has_15_to_60_genes_and_complete_sanitized_descriptions
  expected_selected_pathways: 11

ground_truth:
  count_formula: max(3,min(10,ceil(0.15*pathway_gene_count)))
  selection_seed_base: 20261814
  detection_fraction_min: 0.10
  pooled_sd_min_exclusive: 0.0
  negative_detection_fraction_min: 0.50
  negative_median_min_exclusive: 0.0
  scale_floor: 0.10
  reuse_truth_set_across_strengths_within_scenario: true

perturbations:
  scenarios: [null, mean_shift, cell_subset, mixed_direction]
  strengths_sd: [0.5, 1.0]
  null_strengths_sd: [0.0]
  cell_subset_fraction: 0.30
  definitions:
    null: no_expression_change_and_empty_ground_truth
    mean_shift: positive_shift_all_B_cells
    cell_subset: positive_shift_seeded_30_percent_of_B_cells
    mixed_direction: seeded_positive_negative_truth_genes_all_B_cells_clip_at_zero

genept:
  dimension: 1536
  formula: "X_P @ E_P"
  primary_l2_normalization: false

scpa_masking:
  raw_p_clip: 1.0e-300
  score: minus_log10_raw_p
  vanilla: set_X_gene_column_to_zero
  genept: Z_full_minus_outer_X_gene_E_gene
  delta: full_score_minus_masked_score
  primary_rank: descending_signed_delta
  secondary_rank: descending_absolute_delta
  tie_rule: phase5_average_rank_then_gene_symbol_lexicographic_for_metric_order

llm:
  intended_model: openai/gpt-oss-20b
  current_backend: mock_only
  real_backend_adapter: transformers_gpt_oss_mxfp4_v1
  candidate_ids: C001_based_opaque_ids
  expose_gene_symbols: false
  prompt_conditions: [stats_only, true_description, shuffled_description]
  prompt_order_repeats: 3
  prompt_order_seed_base: 20280814
  description_shuffle_seed_base: 20270814
  summaries: [mean, sd, median, q10, q25, q75, q90, nonzero_fraction]
  forbidden_fields:
    - ground_truth
    - perturbation_scenario
    - perturbation_strength
    - selected_perturbed_genes
    - gene_level_p_values
    - precomputed_fold_change_rank
    - gene_symbol
  shuffled_description:
    preserve_multiset: true
    no_fixed_points_when_possible: true
    changed_fraction_gt: 0.90

inference:
  protocol_status: frozen_not_executable
  model: openai/gpt-oss-20b
  model_revision: null
  tokenizer_revision: null
  primary_backend: huggingface_transformers
  backend_name: transformers_gpt_oss_mxfp4_v1
  prompt_formatting: tokenizer_apply_chat_template
  manually_construct_harmony_tokens: false
  reasoning_effort: low
  developer_instruction_contains_exact_ranking_schema: true
  output_format: json_only
  decoding:
    do_sample: false
    num_beams: 1
    max_new_tokens: 2048
    use_cache: true
    temperature: null
    top_p: null
  invalid_output:
    max_retries_after_initial_attempt: 2
    maximum_total_attempts: 3
    preserve_every_invalid_raw_response: true
    identical_scientific_content_across_retries: true
    record_retry_number_and_failure_reason: true
  loading:
    lazy: true
    local_files_only: true
    device: cuda:0
    device_map: single_cuda_0_no_cpu_offload
    quantization: mxfp4_prequantized
    allow_mxfp4_dequantization: false
    allow_cpu_fallback_for_scientific_production: false
    allow_backend_fallback: false
    cache_path: null
  runtime_requirements:
    min_compute_capability: [7, 5]
    min_vram_gib_primary: 16
    min_vram_gib_pilot_class: 8
    min_system_ram_gib: 32
    min_free_disk_gib: 30
    required_packages: [torch, transformers, accelerate, kernels, triton]
    optional_reported_packages: [openai-harmony]
    min_triton_version: "3.4"
  per_call_provenance:
    - model_name
    - model_revision
    - tokenizer_revision
    - transformers_version
    - torch_version
    - cuda_runtime
    - gpu_model
    - backend_name
    - backend_version
    - reasoning_effort
    - decoding_configuration
    - scientific_content_hash
    - prompt_hash
    - candidate_order_seed
    - candidate_order_hash
    - raw_completion
    - parsed_completion
    - wall_clock_latency_seconds
    - input_token_count
    - output_token_count

runtime_pilot:
  status: defined_not_authorized
  pseudo_split_count: 1
  split_seed_source: cohort.replication.pilot_split_seeds
  pathway_count: 2
  pathway_selection_rule: smallest_and_largest_analysis_gene_count_from_frozen_11_ties_by_pathway
  prompt_conditions: [stats_only]
  candidate_order_repeats: 1
  allowed_measurements:
    - model_load_success
    - peak_vram_and_ram
    - wall_clock_latency
    - tokens_per_second
    - json_validity
    - parser_and_retry_behavior
  forbidden_outputs:
    - recall
    - average_precision
    - ndcg
    - truth_gene_positions
    - method_comparison
    - scientific_ranking_interpretation

evaluation:
  primary_metrics: [recall_at_truth_k, average_precision, ndcg_at_n]
  secondary_metrics: [ndcg_at_truth_k, prompt_order_spearman]
  null_ground_truth_metrics: not_applicable
  metric_implementation: numpy_direct_with_hand_calculated_tests

artifacts:
  interim_directory: data/interim/genept_scpa/phase7_gpt_oss_synthetic
  processed_directory: data/processed/genept_scpa/phase7_gpt_oss_synthetic
  manifest: phase7_synthetic_manifest.json
  cell_assignments: phase7_cell_assignments.csv
  ground_truth: phase7_ground_truth.csv
  expression_h5: phase7_synthetic_expression.h5
  method_runner_ground_truth_access: forbidden
  evaluator_ground_truth_access: required
  runtime_reports_directory: data/interim/genept_scpa/phase7_gpt_oss_synthetic/runtime_reports
  inference_traces_directory: data/interim/genept_scpa/phase7_gpt_oss_synthetic/inference_traces
  invalid_raw_responses_directory: data/interim/genept_scpa/phase7_gpt_oss_synthetic/invalid_raw_responses

execution_gate:
  gpt_oss_download_allowed: false
  real_llm_inference_allowed: false
  production_scpa_allowed: false
  production_synthetic_generation_allowed: false
  mock_toy_smoke_allowed: true
