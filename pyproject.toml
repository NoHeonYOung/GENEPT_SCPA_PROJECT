[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genept-scpa"
version = "0.0.0"
description = "Protocol-frozen GenePT x SCPA experiments"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "h5py>=3.1",
  "matplotlib>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
